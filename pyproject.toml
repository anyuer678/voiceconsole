[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceconsole-mcp"
version = "0.1.0"
description = "语音指令控制台 MCP Server（STT + 意图 + 安全门 + TTS）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
voiceconsole = "main:main"

[tool.setuptools]
py-modules = ["main", "safety", "stt", "intent", "tts", "shell", "config"]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]